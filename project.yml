name: LunchReminder

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LunchReminder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LunchReminder/App
      - path: LunchReminder/Models
      - path: LunchReminder/Services
      - path: LunchReminder/Stores
      - path: LunchReminder/Views
      - path: LunchReminder/Components
      - path: LunchReminder/Utilities
      - path: LunchReminder/Assets.xcassets
      - path: LunchReminder/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrh.lunchreminder
        PRODUCT_NAME: LunchReminder
        INFOPLIST_KEY_CFBundleDisplayName: 三餐提醒
        INFOPLIST_KEY_CFBundleName: LunchReminder
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  LunchReminderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LunchReminderTests
    dependencies:
      - target: LunchReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrh.lunchreminder.tests
        PRODUCT_NAME: LunchReminderTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  LunchReminder:
    shared: true
    build:
      targets:
        LunchReminder: all
        LunchReminderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LunchReminderTests
      gatherCoverageData: false
    archive:
      config: Release
